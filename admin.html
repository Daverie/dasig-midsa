<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>News admin | dasig.midsa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&family=Montserrat:wght@300..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
  .panel{background:var(--tint);border-radius:var(--radius);padding:clamp(1.25rem,4vw,2.5rem)}
  .narrow{max-width:26rem;margin:2rem auto}
  .narrow h1{font-size:2.2rem;margin-bottom:1rem}
  form{display:grid;gap:1.1rem}
  label{display:grid;gap:.35rem;font-weight:700;font-size:.9rem}
  input,select,textarea{font:inherit;font-weight:400;padding:.7rem .9rem;border:1px solid rgba(0,0,0,.18);border-radius:12px;background:#fff;width:100%}
  textarea{min-height:7rem;resize:vertical}
  #body{min-height:22rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem}
  .row{display:grid;gap:1.1rem;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));align-items:end}
  .inline{display:flex;gap:.6rem;align-items:center}
  .check{display:flex;align-items:center;gap:.6rem;font-weight:700}
  .check input{width:auto}
  .hint{font-size:.8rem;font-weight:400;opacity:.75}
  .bar{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:space-between;align-items:center;margin-bottom:1.25rem}
  .bar h1{margin:0}
  .actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:.5rem}
  .tablewrap{overflow-x:auto;background:#fff;border-radius:24px;border:1px solid rgba(0,0,0,.1)}
  table{width:100%;border-collapse:collapse;min-width:40rem}
  th,td{text-align:left;padding:.9rem 1.1rem;border-bottom:1px solid rgba(0,0,0,.08);vertical-align:middle}
  th{font-size:.8rem;opacity:.7}
  tr:last-child td{border-bottom:0}
  .badge{display:inline-block;padding:.2rem .7rem;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--tint);color:var(--main)}
  .badge.draft{background:#eee;color:#555}
  .badge.sched{background:var(--tint-2)}
  .link{background:none;border:0;color:var(--main);font:700 .9rem var(--font);cursor:pointer;padding:.2rem .4rem;text-decoration:underline}
  .link.del{color:#B00020}
  .editor{display:grid;gap:2rem;grid-template-columns:1fr 1fr;align-items:start}
  .preview{background:#fff;border-radius:24px;padding:1.5rem;min-height:12rem}
  .preview h3{color:var(--main);font-size:1.6rem;margin-bottom:.75rem}
  .thumb{max-width:14rem;border-radius:16px;margin-top:.5rem}
  #toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);padding:.8rem 1.4rem;border-radius:14px;background:var(--dark);color:#fff;font-weight:700;z-index:20}
  #toast.err{background:#B00020}
  @media(max-width:900px){.editor{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="midsa.html" aria-label="dasig.MIDSA home">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" fill="#E8E8E8"/><line x1="0" y1="0" x2="40" y2="40" stroke="#C4C4C4" stroke-width="1.5"/></svg>
    <span>admin</span></a>
  <nav aria-label="Admin"><a href="news.html">View news</a><button class="btn sec" id="logout" hidden>Sign out</button></nav>
</header>

<main class="wrap">
  <!-- Sign in -->
  <section id="login">
    <form class="panel narrow" id="loginForm">
      <h1>Editor sign in</h1>
      <label>Password<input type="password" id="pw" required autocomplete="current-password"></label>
      <button class="btn">Sign in</button>
    </form>
  </section>

  <!-- Article list -->
  <section id="dash" hidden>
    <div class="bar"><h1>Articles</h1><button class="btn" id="newBtn">New article</button></div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Title</th><th>Category</th><th>Date</th><th>Status</th><th><span class="sr" style="position:absolute;left:-9999px">Actions</span></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <!-- Editor -->
  <section id="editor" hidden>
    <div class="bar"><h1 id="edTitle">New article</h1><button class="btn sec" id="back" type="button">Back to list</button></div>
    <form id="form" class="panel" novalidate>
      <label>Title<input id="title" required maxlength="200"></label>
      <div class="row">
        <label>Slug (web address)<input id="slug" maxlength="80" placeholder="auto-filled from the title"></label>
        <label>Category
          <span class="inline"><select id="category"></select><button type="button" class="btn sec" id="addCat">Add</button></span>
        </label>
      </div>
      <div class="row">
        <label>Publish date<input type="date" id="publishedAt" required></label>
        <label>Status<select id="status"><option value="draft">Draft (hidden)</option><option value="published">Published</option></select></label>
        <label>Author<input id="author" maxlength="100"></label>
      </div>
      <label>Summary <span class="hint">Shown on cards, up to 300 characters.</span><textarea id="excerpt" maxlength="300" style="min-height:5rem"></textarea></label>
      <label>Cover image
        <input id="cover" placeholder="https://… or upload below">
        <input type="file" id="file" accept="image/jpeg,image/png,image/gif,image/webp">
        <img id="thumb" class="thumb" alt="" hidden>
      </label>
      <label class="check"><input type="checkbox" id="featured"> Feature on the home page</label>
      <div class="editor">
        <label>Story <span class="hint">Blank line = new paragraph &middot; ## Subheading &middot; **bold**</span><textarea id="body"></textarea></label>
        <div><strong style="font-size:.9rem">Preview</strong><div class="preview prose" id="preview"></div></div>
      </div>
      <div class="actions">
        <button class="btn" type="submit">Save article</button>
        <button class="btn sec" type="button" id="cancel">Cancel</button>
        <button class="btn danger" type="button" id="delBtn" hidden>Delete</button>
      </div>
    </form>
  </section>
</main>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="midsa-news.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const today = () => new Date().toISOString().slice(0, 10);
  let token = sessionStorage.getItem('midsa_token'), D = { categories: [], articles: [] }, editing = null, slugTouched = false, tt;

  function toast(msg, err) {
    const t = $('toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.hidden = false;
    clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 4000);
  }
  function view(name) {
    ['login', 'dash', 'editor'].forEach(v => $(v).hidden = v !== name);
    $('logout').hidden = name === 'login';
    scrollTo(0, 0);
  }
  function signOut() { token = null; sessionStorage.removeItem('midsa_token'); view('login'); }

  async function api(path, opt = {}) {
    const headers = { 'X-Admin-Token': token || '' };
    if (opt.json) headers['Content-Type'] = 'application/json';
    const r = await fetch(path, { method: opt.method || 'GET', headers, body: opt.json ? JSON.stringify(opt.json) : opt.body });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401 && path !== '/api/login') signOut();
    if (!r.ok) throw new Error(j.error || 'Something went wrong.');
    return j;
  }

  async function refresh() {
    D = await api('/api/admin/news');
    const cats = Object.fromEntries(D.categories.map(c => [c.slug, c.name]));
    const rows = [...D.articles].sort((a, b) => b.publishedAt.localeCompare(a.publishedAt));
    $('rows').innerHTML = rows.length ? rows.map(a => {
      const st = a.status !== 'published' ? ['draft', 'Draft'] : a.publishedAt > today() ? ['sched', 'Scheduled'] : ['', 'Published'];
      return `<tr><td><strong>${esc(a.title)}</strong>${a.featured ? ' <span class="badge">Featured</span>' : ''}</td>
        <td>${esc(cats[a.category] || '')}</td><td>${fmtDate(a.publishedAt)}</td>
        <td><span class="badge ${st[0]}">${st[1]}</span></td>
        <td><button class="link" data-edit="${esc(a.slug)}">Edit</button>
            <button class="link del" data-del="${esc(a.slug)}">Delete</button></td></tr>`;
    }).join('') : '<tr><td colspan="5">No articles yet. Click <strong>New article</strong> to write the first one.</td></tr>';
    $('category').innerHTML = D.categories.map(c => `<option value="${esc(c.slug)}">${esc(c.name)}</option>`).join('');
  }

  function setThumb() { const v = $('cover').value.trim(); $('thumb').hidden = !v; if (v) $('thumb').src = v; }
  function preview() {
    $('preview').innerHTML = '<h3>' + esc($('title').value || 'Untitled') + '</h3>' + renderBody($('body').value);
  }
  function openEditor(a) {
    editing = a ? a.slug : null; slugTouched = !!a;
    $('edTitle').textContent = a ? 'Edit article' : 'New article';
    $('title').value = a ? a.title : ''; $('slug').value = a ? a.slug : '';
    if (D.categories.length) $('category').value = a ? a.category : D.categories[0].slug;
    $('publishedAt').value = a ? a.publishedAt : today();
    $('status').value = a ? a.status : 'draft';
    $('author').value = a ? a.author || '' : ''; $('excerpt').value = a ? a.excerpt || '' : '';
    $('cover').value = a ? a.cover || '' : ''; $('file').value = '';
    $('featured').checked = !!(a && a.featured); $('body').value = a ? a.body || '' : '';
    $('delBtn').hidden = !a; setThumb(); preview(); view('editor'); $('title').focus();
  }
  async function remove(slug) {
    const a = D.articles.find(x => x.slug === slug);
    if (!a || !confirm('Delete "' + a.title + '"? This cannot be undone.')) return;
    try { await api('/api/admin/articles/' + encodeURIComponent(slug), { method: 'DELETE' }); await refresh(); view('dash'); toast('Article deleted.'); }
    catch (e) { toast(e.message, true); }
  }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      token = (await api('/api/login', { method: 'POST', json: { password: $('pw').value } })).token;
      sessionStorage.setItem('midsa_token', token); $('pw').value = '';
      await refresh(); view('dash');
    } catch (err) { toast(location.protocol === 'file:' ? 'Run server.py and open this page from it.' : err.message, true); }
  });
  $('logout').onclick = signOut;
  $('newBtn').onclick = () => openEditor(null);
  $('back').onclick = $('cancel').onclick = () => view('dash');
  $('delBtn').onclick = () => remove(editing);
  $('rows').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.edit) openEditor(D.articles.find(a => a.slug === b.dataset.edit));
    if (b.dataset.del) remove(b.dataset.del);
  });

  $('title').addEventListener('input', () => {
    if (!slugTouched) $('slug').value = $('title').value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 80);
    preview();
  });
  $('slug').addEventListener('input', () => slugTouched = true);
  $('body').addEventListener('input', preview);
  $('cover').addEventListener('change', setThumb);

  $('file').addEventListener('change', async () => {
    const f = $('file').files[0]; if (!f) return;
    try { const r = await api('/api/admin/upload', { method: 'POST', body: f }); $('cover').value = r.url; setThumb(); toast('Image uploaded.'); }
    catch (e) { toast(e.message, true); }
  });
  $('addCat').onclick = async () => {
    const name = prompt('New category name'); if (!name) return;
    try { const r = await api('/api/admin/categories', { method: 'POST', json: { name } }); await refresh(); $('category').value = r.slug; }
    catch (e) { toast(e.message, true); }
  };

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const data = { title: $('title').value, slug: $('slug').value, category: $('category').value, publishedAt: $('publishedAt').value,
      status: $('status').value, author: $('author').value, excerpt: $('excerpt').value, cover: $('cover').value,
      featured: $('featured').checked, body: $('body').value };
    try {
      await api(editing ? '/api/admin/articles/' + encodeURIComponent(editing) : '/api/admin/articles',
        { method: editing ? 'PUT' : 'POST', json: data });
      await refresh(); view('dash');
      toast(data.status === 'published' ? 'Saved and published.' : 'Saved as draft.');
    } catch (err) { toast(err.message, true); }
  });

  // Resume an existing session
  if (token) refresh().then(() => view('dash')).catch(() => view('login')); else view('login');
})();
</script>
</body>
</html>
